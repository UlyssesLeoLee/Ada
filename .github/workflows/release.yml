name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: cut release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CHANGELOG
        id: changelog
        run: |
          head=$(sed -n '/^## /{p;q}' docs/CHANGELOG.md | sed 's/^## //')
          echo "headline=$head" >> $GITHUB_OUTPUT

      - name: Build release artifacts
        run: |
          cargo build --workspace --locked --release
          cargo build -p gm-console --locked --release --target x86_64-unknown-linux-gnu
          ls -la target/release/

      - name: Package gm-console binary
        run: |
          mkdir -p release-artifacts
          cp target/release/gm-console-server release-artifacts/gm-console-server-x86_64-unknown-linux-gnu
          cd release-artifacts && sha256sum gm-console-server-x86_64-unknown-linux-gnu > gm-console-server-x86_64-unknown-linux-gnu.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gm-console-server
          path: release-artifacts/

      - name: Cut GitHub release (when tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.headline }}
          body: |
            ## What's in this release
            See [docs/CHANGELOG.md](docs/CHANGELOG.md) for the canonical change list.

            ## Artifacts
            - `gm-console-server-x86_64-unknown-linux-gnu` (Linux x86_64)
            - `.sha256` checksum
          files: |
            release-artifacts/gm-console-server-x86_64-unknown-linux-gnu
            release-artifacts/gm-console-server-x86_64-unknown-linux-gnu.sha256
          fail_on_unmatched_files: true
