version: 2
updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - 'deps'
      - 'rust'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'deps'
      - 'ci'

  - package-ecosystem: 'dart'
    directory: '/apps/gm-console-app'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'flutter'
