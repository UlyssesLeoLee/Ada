# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Used by .github/workflows/ci.yml — security job.
# Per task brief: bans/licenses/sources/advisories.

[graph]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Every entry is an `unmaintained` advisory, not a vulnerability: there is
# no vulnerable code here, only a dependency whose maintainer has gone
# away. None of the three can be removed, because each is transitive under
# a dependency the project is not replacing -- yrs, casbin and utoipa are
# respectively the CRDT engine, the policy evaluator and the OpenAPI macro
# for the gateway. `deny.toml` fails the build on them otherwise, so the
# gate cannot go green until they are decided on the record, which is what
# this list is. Drop an entry when the parent dependency is upgraded past
# it, or when the advisory is withdrawn.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; rustsec records 'no safe upgrade is available'. Reached only through utoipa-gen -> utoipa -> ada-m13-api-gateway, and it is a build-time proc-macro, so it contributes no code to the shipped binary. Recheck when utoipa drops it." },
  { id = "RUSTSEC-2026-0215", reason = "smallstr is unmaintained, all versions affected, no fix. Transitive under yrs, the CRDT engine behind ada-m12-canvas-editor's `crdt` feature. No runtime exploit is described; the risk is that a future soundness fix will not be picked up." },
  { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained, all versions affected, no fix. Transitive under rhai -> casbin -> ada-rbac-casbin, i.e. the policy engine on the gateway's authorization path. Revisit when casbin replaces its script engine." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  # webpki-roots (pulled in transitively by reqwest/rustls) ships the
  # Mozilla CA bundle under the Community Data License Agreement,
  # Permissive 2.0. That is a permissive, patent-grant license with no
  # copyleft or network-use obligation, so it belongs in an allow list
  # that already accepts MIT/Apache/BSD. Listed explicitly so the
  # exception is a decision on record rather than a silenced failure.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# One git dependency, pinned to an exact commit. `aci-emitter` is not
# published to crates.io, and `deny.toml` denying every git source while
# the workspace depends on one is a contradiction rather than a policy --
# the gate simply could not go green. Pinning `rev` in Cargo.toml is what
# makes this safe: the commit is immutable, so the fetch is reproducible
# and a moved branch cannot change what gets built. Promote the crate to
# crates.io (or vendor it) and delete this line.
allow-git = ["https://github.com/UlyssesLeoLee/aci-emitter"]
