# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Used by .github/workflows/ci.yml — security job.
# Per task brief: bans/licenses/sources/advisories.

[graph]
# The whole workspace, every optional dependency included.
#
# With `all-features = false` this gate only ever saw the dependency graph
# reachable from DEFAULT features, so the crates pulled in by
# ada-telemetry's `prometheus`, ada-mock's `server`, ada-m12's `crdt` and
# ada-rbac-casbin's `hand-rolled` were built and tested by CI while sitting
# outside the licence, advisory and source checks entirely. That is the gate
# being weaker than the thing it gates.
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Every entry is an `unmaintained` advisory, not a vulnerability: there is
# no vulnerable code here, only a dependency whose maintainer has gone
# away. None of the five can be removed, because each is transitive under
# a dependency the project is not replacing -- yrs, casbin, utoipa, egui and
# bevy_winit are respectively the CRDT engine, the policy evaluator, the
# OpenAPI macro for the gateway, the immediate-mode UI toolkit behind the
# canvas editor, and the windowing layer under it. `deny.toml` fails the
# build on them otherwise, so the gate cannot go green until they are
# decided on the record, which is what this list is. Drop an entry when the
# parent dependency is upgraded past it, or when the advisory is withdrawn.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; rustsec records 'no safe upgrade is available'. Reached only through utoipa-gen -> utoipa -> ada-m13-api-gateway, and it is a build-time proc-macro, so it contributes no code to the shipped binary. Recheck when utoipa drops it." },
  { id = "RUSTSEC-2026-0215", reason = "smallstr is unmaintained, all versions affected, no fix. Transitive under yrs, the CRDT engine behind ada-m12-canvas-editor's `crdt` feature. No runtime exploit is described; the risk is that a future soundness fix will not be picked up." },
  { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained, all versions affected, no fix. Transitive under rhai -> casbin -> ada-rbac-casbin, i.e. the policy engine on the gateway's authorization path. Revisit when casbin replaces its script engine." },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained. Reached only through accesskit_windows -> accesskit_winit -> bevy_winit -> bevy -> bevy_egui -> ada-m12-canvas-editor, and cargo reports it as a (proc-macro), so it is expanded at build time and contributes no code to any shipped binary. Only visible because the graph now includes all features." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, all versions affected, no fix. Chain: ttf-parser <- owned_ttf_parser <- ab_glyph <- epaint <- egui <- ada-m12-canvas-editor, i.e. the font-glyph parsing behind egui's text rendering. Revisit when egui drops ab_glyph or ab_glyph drops ttf-parser." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  # webpki-roots (pulled in transitively by reqwest/rustls) ships the
  # Mozilla CA bundle under the Community Data License Agreement,
  # Permissive 2.0. That is a permissive, patent-grant license with no
  # copyleft or network-use obligation, so it belongs in an allow list
  # that already accepts MIT/Apache/BSD. Listed explicitly so the
  # exception is a decision on record rather than a silenced failure.
  "CDLA-Permissive-2.0",
  # epaint 0.28 declares
  #   (MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0
  # The trailing two are the licences on the font files egui embeds for
  # its default UI typeface, not on any code. OFL-1.1 (SIL Open Font
  # License) and UFL-1.0 (Ubuntu Font Licence) are both permissive font
  # licences: they grant use, embedding and redistribution and require
  # only that the font itself not be sold on its own and that a modified
  # font not reuse the reserved names. Neither imposes a copyleft or
  # network-use obligation on the code that draws the glyphs, so they
  # belong alongside MIT/Apache/BSD in an allow list that already accepts
  # them. UFL-1.0 is a LicenseRef, so it is not an SPDX id and can only be
  # allowed by exact string. Only visible because the graph now includes
  # all features -- epaint arrives via egui <- bevy_egui <-
  # ada-m12-canvas-editor's bevy_egui feature.
  "OFL-1.1",
  "LicenseRef-UFL-1.0",
  # xxhash-rust 0.8, a non-optional dependency of redis 1.7 (it hashes
  # `SCRIPT LOAD` payloads, so it cannot be feature-gated off), declares
  # BSL-1.0 -- the Boost Software License 1.0. That is OSI-approved and
  # permissive: it grants use, modification and redistribution, carries a
  # patent grant, and imposes no copyleft, no source-disclosure and no
  # network-use obligation. In obligation terms it sits with MIT, which
  # this list already accepts.
  #
  # Listed rather than silenced, for the same reason as the two entries
  # above it: an unfamiliar licence in a dependency is a decision to put
  # on record, not a failure to be suppressed. This one arrived with
  # `redis`, which is the shared session store the gateway's
  # `AuthContext::bootstrap` connects to and refuses to start without --
  # dropping it to avoid this entry would mean giving up the
  # cross-replica session validity the whole change exists for.
  "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# One git dependency, pinned to an exact commit. `aci-emitter` is not
# published to crates.io, and `deny.toml` denying every git source while
# the workspace depends on one is a contradiction rather than a policy --
# the gate simply could not go green. Pinning `rev` in Cargo.toml is what
# makes this safe: the commit is immutable, so the fetch is reproducible
# and a moved branch cannot change what gets built. Promote the crate to
# crates.io (or vendor it) and delete this line.
allow-git = ["https://github.com/UlyssesLeoLee/aci-emitter"]
