# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Used by .github/workflows/ci.yml — security job.
# Per task brief: bans/licenses/sources/advisories.

[graph]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # RUSTSEC advisories to ignore go here with explicit reason.
  # e.g. { id = "RUSTSEC-2024-0001", reason = "patch in alpha, not yet published" }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  # webpki-roots (pulled in transitively by reqwest/rustls) ships the
  # Mozilla CA bundle under the Community Data License Agreement,
  # Permissive 2.0. That is a permissive, patent-grant license with no
  # copyleft or network-use obligation, so it belongs in an allow list
  # that already accepts MIT/Apache/BSD. Listed explicitly so the
  # exception is a decision on record rather than a silenced failure.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
