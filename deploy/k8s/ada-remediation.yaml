---
# k8s deployment manifest for ada-remediation (v0.1.0)
#
# Apply: kubectl apply -f deploy/k8s/ada-remediation.yaml
#
# SECRET PLACEHOLDERS: replace `stringData` values below with
# real secrets managed by sealed-secrets, external-secrets,
# or your secret store of choice. The placeholders here are
# intentionally non-functional strings so an accidental
# `kubectl apply` against a real cluster cannot leak a
# real credential.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ada-remediation-config
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
data:
  # runbook directory mounted from a ConfigMap or a CSI volume
  # (mounting from ConfigMap keeps runbooks read-only and
  # versioned; for hot-reload, use a CSI-backed volume)
  REMEDIATION_RUNBOOK_DIR: "/etc/ada-remediation/runbooks"
  # bind to all interfaces inside the pod (k8s networking
  # routes via the Service to the pod IP)
  REMEDIATION_BIND_ADDR: "0.0.0.0:9100"
  # log level: trace | debug | info | warn | error
  RUST_LOG: "info,ada_remediation=debug"
---
# ada-remediation-runbooks -- the runbooks the remediation engine executes.
#
# GENERATED from config/remediation by
# crates/ada-remediation/scripts/gen-runbooks-configmap.py -- do not edit by hand.
#
# `every_runbook_on_disk_is_mounted_by_the_deployment` in
# crates/ada-core/tests/mounted_configmaps.rs fails the build if this and
# the directory disagree, so this is a rendering of the runbooks rather than
# a second copy of them. Regenerate it after editing anything in there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ada-remediation-runbooks
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
data:
  db-connection-pool-exhausted.json: |
    {
      "version": 1,
      "_comment": "Phase 8 / 14-auto-remediation.md §5.3. P2/P3. The pg function `remediation_kill_idle` (v0.6.x future) closes idle sessions older than 5 min on the affected database. Notify #ada-ops so the postmortem picks up the burst.",
      "actions": [
        {
          "id": "db-pool-exhausted-kill-idle",
          "name": "DB connection pool exhausted — kill idle sessions",
          "trigger": "DBConnectionPoolExhausted",
          "severities": ["P2", "P3"],
          "steps": [
            {
              "kind": "pg_function",
              "name": "remediation_kill_idle",
              "args": ["{{ $labels.database }}", "300"]
            },
            {
              "kind": "notify_slack",
              "channel": "#ada-ops",
              "message": "auto-remediation killed idle sessions on {{ $labels.database }} (pool exhausted since {{ $labels.starts_at }})"
            }
          ],
          "cooldown": 900,
          "max_retries": 1
        }
      ]
    }

  disk-space-low.json: |
    {
      "version": 1,
      "_comment": "Phase 8 / 14-auto-remediation.md §5.1. JSON (not YAML) due to offline build env (no serde_yaml in Cargo.lock). All step 'cmd'/'channel' values are template-free; alerting uses Alertmanager's separate Slack/PagerDuty receivers for the user-facing message — these auto-remediation steps are for the *operator* (sizing, postmortem trail).",
      "actions": [
        {
          "id": "disk-space-low",
          "name": "Disk space low on {{ $labels.instance }}",
          "trigger": "DiskSpaceFillingFast",
          "severities": ["P2", "P3"],
          "steps": [
            {
              "kind": "run_command",
              "cmd": "du",
              "args": ["-sh", "/var/log"],
              "timeout_secs": 30
            },
            {
              "kind": "run_command",
              "cmd": "find",
              "args": ["/var/log", "-type", "f", "-name", "*.gz", "-mtime", "+7", "-delete"],
              "timeout_secs": 60
            },
            {
              "kind": "notify_slack",
              "channel": "#ada-ops",
              "message": "auto-remediation disk-space-low ran on {{ $labels.instance }} — see Phase 8 dashboard for step results"
            }
          ],
          "cooldown": 1800,
          "max_retries": 1
        }
      ]
    }

  service-down.json: |
    {
      "version": 1,
      "_comment": "Phase 8 / 14-auto-remediation.md §5.2. P1 only — ServiceDown on a production service means user impact. Auto-remediation tries the in-cluster restart first (the pg function `remediation_restart_service` is a future v0.6.x addition — for now the step is a dry-run), then pages the on-call with the runbook URL.",
      "actions": [
        {
          "id": "service-down-restart-and-page",
          "name": "Service {{ $labels.service }} down — restart and page",
          "trigger": "ServiceDown",
          "severities": ["P1"],
          "steps": [
            {
              "kind": "pg_function",
              "name": "remediation_restart_service",
              "args": ["{{ $labels.service }}", "{{ $labels.instance }}"]
            },
            {
              "kind": "page_operator",
              "severity": "high",
              "runbook_url": "docs/observability/14-auto-remediation.md"
            }
          ],
          "cooldown": 600,
          "max_retries": 2
        }
      ]
    }

  slo-budget-burn-rate-fast.json: |
    {
      "version": 1,
      "_comment": "Phase 8 / 14-auto-remediation.md §5.4. SLIBurnRateFast (2% budget in 1h) is the alert that pages the on-call per the Google SRE workbook. Auto-remediation here only *amplifies* the page; it does not attempt corrective action (the burn may be from a deploy, code regression, infra, or external — wrong retry is worse than no retry). Severity=high, cooldown=3600 so we do not double-page during a sustained burn.",
      "actions": [
        {
          "id": "slo-burn-fast-page",
          "name": "SLO budget burning fast ({{ $labels.service }} / {{ $labels.slo }})",
          "trigger": "SLIBurnRateFast",
          "severities": ["P1"],
          "steps": [
            {
              "kind": "page_operator",
              "severity": "high",
              "runbook_url": "docs/observability/14-auto-remediation.md"
            }
          ],
          "cooldown": 3600,
          "max_retries": 0
        }
      ]
    }

  slo-budget-burn-rate-slow.json: |
    {
      "version": 1,
      "_comment": "Phase 8 / 14-auto-remediation.md §5.5. SLIBurnRateSlow (5% budget in 6h) is the 'you have a few days' burn — no page, just a Slack post in #ada-warnings so the team sees it during standup. cooldown=7200 (2h) so a sustained slow burn does not flood the channel.",
      "actions": [
        {
          "id": "slo-burn-slow-notify",
          "name": "SLO budget burning slowly ({{ $labels.service }} / {{ $labels.slo }})",
          "trigger": "SLIBurnRateSlow",
          "severities": ["P2", "P3"],
          "steps": [
            {
              "kind": "notify_slack",
              "channel": "#ada-warnings",
              "message": "SLO slow burn: service={{ $labels.service }} slo={{ $labels.slo }} window={{ $labels.window }} (per Phase 7 dashboard 90)"
            }
          ],
          "cooldown": 7200,
          "max_retries": 0
        }
      ]
    }


---
apiVersion: v1
kind: Secret
metadata:
  name: ada-remediation-secrets
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
type: Opaque
stringData:
  # PLACEHOLDER: replace with `kubectl create secret
  # generic ada-remediation-secrets --from-literal=...`
  # or via sealed-secrets/external-secrets
  REMEDIATION_WEBHOOK_SECRET: "PLACEHOLDER_WEBHOOK_SECRET_REPLACE_ME"
  REMEDIATION_TRIGGER_SECRET: "PLACEHOLDER_TRIGGER_SECRET_REPLACE_ME"
  # Credentials the runbook steps in config/remediation/ need.
  #
  # These two are read at step time, not at boot, so a deployment
  # missing them starts cleanly and passes both probes -- the gap
  # only opened when an alert fired a `notify_slack` or
  # `page_operator` step. A step that cannot do its job now fails
  # the action instead of recording a success nobody received, so
  # an unset key shows up as a failed remediation rather than as a
  # silent one.
  #
  # `crates/ada-core/tests/remediation_secrets.rs` fails if a step
  # kind in a shipped runbook reads a key this Secret does not
  # declare, so adding a step that needs a new credential is a
  # compile-time-visible change here rather than a runtime surprise.
  SLACK_WEBHOOK_URL: "PLACEHOLDER_SLACK_WEBHOOK_URL_REPLACE_ME"
  PAGERDUTY_ROUTING_KEY: "PLACEHOLDER_PAGERDUTY_ROUTING_KEY_REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-remediation
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ada-remediation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ada-remediation
        app.kubernetes.io/version: v0.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ada-remediation
          image: ghcr.io/ulyssesleolee/ada-remediation:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ada-remediation-config
            - secretRef:
                name: ada-remediation-secrets
          env:
            # The Pod's downward API, for log collectors that
            # aggregate by pod. Nothing in this repository reads
            # either variable: the service reads RUST_LOG,
            # REMEDIATION_BIND_ADDR, REMEDIATION_RUNBOOK_DIR,
            # REMEDIATION_WEBHOOK_SECRET and
            # REMEDIATION_TRIGGER_SECRET at boot (the ConfigMap
            # and the Secret below), plus SLACK_WEBHOOK_URL and
            # PAGERDUTY_ROUTING_KEY later, per step. These two
            # exist for the scrape side, not for the service. The
            # previous comment implied the service used them for
            # its own log prefix, which it does not.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              # Must be a path `ada-remediation` actually serves. It
              # serves `/health`, not `/healthz`. This manifest
              # previously probed `/healthz`, which 404s: readiness
              # never went green, so the pod was never added to the
              # Service, and liveness killed the container after
              # ~35s, for a permanent CrashLoopBackOff. Nothing in
              # `cargo build` or `kubectl apply` can catch a probe path
              # that is valid YAML and a valid HTTP path but is not
              # routed -- the three services disagree on the spelling
              # (`gm-console` -> /healthz, `ada-api-gateway` ->
              # /health/live + /health/ready, this one -> /health) and
              # each manifest has to name its own. The invariant is
              # pinned by `ada-core`'s `probe_paths_match_the_routes_they_call`
              # test, which reads this file and the router source
              # together.
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runbooks
              mountPath: /etc/ada-remediation/runbooks
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runbooks
          # Mount the runbook ConfigMap read-only. For
          # hot-reload to pick up live edits, swap this
          # for a CSI-backed RWX volume.
          #
          # No `optional: true` here. It used to be there because this
          # ConfigMap was never defined, and `optional` is what made the
          # absence silent. Now that it is defined with the real runbooks
          # baked in, the only thing the flag still does is turn a deleted
          # ConfigMap, or an apply that skipped this file, into a pod that
          # starts with an empty directory and remediates nothing -- the
          # exact defect this volume was added to fix. Fail loudly instead.
          configMap:
            name: ada-remediation-runbooks
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ada-remediation
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ada-remediation
  ports:
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ada-remediation
  namespace: observability
  labels:
    app.kubernetes.io/name: ada-remediation
    app.kubernetes.io/version: v0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ada-remediation
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Alertmanager webhook + Prometheus scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9100
          protocol: TCP
  egress:
    # Slack / PagerDuty / PG-function HTTP egress
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
