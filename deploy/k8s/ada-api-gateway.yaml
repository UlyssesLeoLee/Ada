---
# ada-api-gateway — the backend gm-console proxies to.
#
# WHY THIS FILE EXISTS
#
# `gm-console.yaml` sets `GM_CONSOLE_UPSTREAM=http://ada-api-gateway:8080`.
# Until this manifest was added, no Service by that name existed anywhere
# in this repository: the only two Services in deploy/k8s were
# `gm-console` and `ada-remediation`. The string `ada-api-gateway`
# appeared solely as an env value, never as a Service. DNS resolution for
# it therefore failed inside the cluster and every `/api/*` request
# through the only deployed service returned 502 BAD_GATEWAY.
#
# The Service name is load-bearing. If it drifts from the host half of
# GM_CONSOLE_UPSTREAM, the failure mode changes from a visible 502 to a
# connection refusal, which is much harder to diagnose from outside. A
# unit test in crates/ada-m13-api-gateway/src/main.rs pins the binary's
# default bind to match this file's containerPort, and this comment is
# the other half of that pairing.
#
# The binary is named `ada-api-gateway` rather than after its package
# (`ada-m13-api-gateway`) for the same reason: the [[bin]] name is the
# image's entrypoint and must match the Service.
#
# WHAT THIS SERVICE IS NOT
#
# This manifest makes the deployed topology coherent and gives the
# gateway the session store it refuses to start without. It does not
# configure any credential.
#
# `/api/*` has been behind `require_principal` middleware since the
# authentication boundary landed, and `POST /api/v1/auth/login` is the
# only route that mints a session. Both sides of that still need operator
# input to be useful:
#
#   - `ADA_GATEWAY_LOGIN_USERS` -- unset means the directory is empty,
#     which means every login is a 401. The gateway logs a warning at
#     startup and serves anyway, because "no credentials configured" and
#     "credentials configured and all wrong" must be indistinguishable
#     from outside.
#   - `ADA_SESSION_REDIS_URL` -- set here to the placeholder
#     `ada-session-redis` Service below.
#
# So a green deployment of this file is a gateway that is genuinely
# fail-closed, not one that has been given a way in. Do not read a
# successful rollout as an authenticated one; check that
# `ADA_GATEWAY_LOGIN_USERS` is populated in the target namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-api-gateway
  labels:
    app: ada-api-gateway
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ada-api-gateway
  template:
    metadata:
      labels:
        app: ada-api-gateway
    spec:
      # Matches ada-remediation.yaml exactly, so all three Deployments in
      # this directory state the same posture. UID 65532 is the `ada` user
      # the three Dockerfiles in deploy/docker/ create with an explicit
      # uid, rather than whatever `useradd --system` happens to allocate --
      # a build-order-dependent UID would make this manifest non-deterministic.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ada-api-gateway
          image: ghcr.io/ulyssesleolee/ada-api-gateway:v0.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            # Must stay identical to the default in
            # crates/ada-m13-api-gateway/src/main.rs.
            - name: ADA_GATEWAY_BIND
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "info,ada_m13_api_gateway=debug"
            # The binary's compiled-in casbin policy path is
            # env!("CARGO_MANIFEST_DIR")/policies, which does not exist
            # in the image. Without this the pod exits before it binds
            # with "policy reload failed: policy file not found", and
            # without this manifest the same crash happens in every
            # deployment. Must match the path the image copies the
            # policy files to in deploy/docker/ada-api-gateway.Dockerfile.
            - name: ADA_RBAC_POLICY_DIR
              value: "/etc/ada-rbac/policies"
            # The shared session store. `AuthContext::bootstrap` refuses
            # to start without a reachable one, and there is deliberately
            # no in-process fallback: a per-process map 401s every valid
            # credential the moment a request lands on the other replica
            # (this Deployment runs `replicas: 2`), and a restart
            # invalidates every outstanding session. Without this variable
            # the pod exits before it binds its port, which is the correct
            # outcome for an authentication service that cannot check a
            # credential -- but it is a CrashLoop, so the variable has to
            # be here.
            #
            # The Service below is a placeholder topology, not a
            # recommendation to run Redis this way in production: no
            # persistence, no auth, no eviction policy, one replica.
            # Point this at a managed instance for a real deployment.
            - name: ADA_SESSION_REDIS_URL
              value: "redis://ada-session-redis:6379"
          # /health/live is the liveness probe target: it is the only
          # handler that cannot depend on a backing service, so a
          # dependency outage must not cause a restart loop.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Must exceed SHUTDOWN_GRACE (25s) in
          # crates/ada-m13-api-gateway/src/server.rs, or the kubelet
          # SIGKILLs the process before the drain finishes.
          terminationGracePeriodSeconds: 30
          # Same posture as deploy/k8s/ada-remediation.yaml, which already
          # had it. This manifest and gm-console.yaml had no
          # `securityContext` at all, which Trivy flagged as KSV014 (HIGH)
          # in the `security scan` job -- the first time that step ever ran
          # to completion, because cargo-deny had been failing first.
          #
          # readOnlyRootFilesystem needs somewhere writable: the process
          # writes nothing, but /tmp is where any library that wants a
          # scratch file (or a crash handler that wants a core) will try, and
          # a read-only root turns that into a hard failure at the worst
          # moment. An emptyDir at /tmp is the same pattern remediation uses.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # On the container, not the pod spec. It was previously nested
          # inside the `volumes:` entry below, which made it a key of an
          # emptyDir volume rather than of the container: every apply
          # succeeded, `kubectl kustomize` rendered without complaint, and
          # the pod came up with no requests and no limits at all -- the
          # one field that tells the scheduler what this workload costs
          # and tells the kubelet when to throttle it. Silence is what a
          # dropped key looks like; this was only caught by parsing the
          # *rendered* output and asking where `resources` actually
          # ended up.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ada-api-gateway
  labels:
    app: ada-api-gateway
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: ada-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Keep one pod serving during voluntary disruptions (node drains,
# upgrades). minAvailable=1 is safe with 2 replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ada-api-gateway
  labels:
    app: ada-api-gateway
    tier: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ada-api-gateway
---
# ada-session-redis — the shared session store the gateway refuses to
# start without.
#
# WHY THIS EXISTS
#
# `AuthContext::bootstrap` connects to `ADA_SESSION_REDIS_URL` during
# startup and treats "cannot reach it" as a fatal error. That is a
# deliberate fail-closed choice (see crates/ada-m13-api-gateway/src/auth.rs)
# and it is what makes the gateway's sessions valid across replicas — but
# it also means the topology is incomplete without a Redis to point at.
# Before this, `kubectl apply -k deploy/k8s/` produced a Deployment that
# could only ever CrashLoopBackOff.
#
# WHAT THIS IS NOT
#
# This is a placeholder that makes the reference topology run, not a
# production session store. It has:
#
#   - no persistence (sessions vanish on restart -- every user re-logs in)
#   - no authentication and no TLS (in-cluster only)
#   - one replica, so it is a single point of failure
#   - no eviction policy, so it can OOM rather than shed cold sessions
#
# A real deployment points `ADA_SESSION_REDIS_URL` at a managed instance
# and drops this file. Sessions are the credential authority for the whole
# multi-tenant model, so the storage behind them is not the place to save
# on engineering.
#
# START ORDER
#
# The gateway does not wait for this. Kubernetes has no ordering between
# two Deployments in one apply, so on a cold cluster the gateway may exit
# first and be restarted by CrashLoopBackOff's exponential backoff until
# Redis answers. That is correct-by-restart rather than ordered: the
# alternative -- a gateway that starts without a store and answers 401 --
# is the bug this whole change exists to remove. An initContainer would
# make the ordering explicit at the cost of a third image this repository
# cannot build; a real deployment gets ordering from its orchestrator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-session-redis
  labels:
    app: ada-session-redis
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ada-session-redis
  template:
    metadata:
      labels:
        app: ada-session-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          # `--save ''` and `--appendonly no`: the persistence settings of
          # the upstream image are tuned for a cache, and for a credential
          # store the honest options are "durable" or "explicitly not".
          # This picks the latter and says so, rather than inheriting an
          # RDB dump on a timer nobody chose.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ada-session-redis
  labels:
    app: ada-session-redis
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: ada-session-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
