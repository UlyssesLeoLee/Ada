---
# gm-console — commercial Web operations console
# Reference deployment under deploy/k8s/. Worker-A owns final ingress tuning;
# Mavis scaffold sticks to user's 2026-09-01 hard rule: nginx → envoy, envoy
# *as a separate Deployment* (NOT istio sidecar).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gm-console
  labels:
    app: gm-console
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gm-console
  template:
    metadata:
      labels:
        app: gm-console
    spec:
      # Matches ada-remediation.yaml exactly, so all three Deployments in
      # this directory state the same posture. UID 65532 is the `ada` user
      # the three Dockerfiles in deploy/docker/ create with an explicit
      # uid, rather than whatever `useradd --system` happens to allocate --
      # a build-order-dependent UID would make this manifest non-deterministic.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gm-console
          image: ghcr.io/ulyssesleolee/gm-console:v0.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GM_CONSOLE_BIND
              value: "0.0.0.0:8080"
            - name: GM_CONSOLE_UPSTREAM
              value: "http://ada-api-gateway:8080"
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          # Same posture as ada-remediation.yaml, which already had it. This
          # manifest and ada-api-gateway.yaml had no `securityContext` at
          # all, which Trivy flagged as KSV014 (HIGH) in the `security scan`
          # job -- the first time that step ever completed, because
          # cargo-deny had been failing first.
          #
          # The SPA is served from GM_CONSOLE_STATIC_DIR, which in the
          # shipped manifests is unset, so nothing here reads the document
          # root. If that is ever pointed at a path, it has to be a volume
          # mount (read-only) rather than a write to the image filesystem,
          # or the read-only root turns the console into a 500.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gm-console
spec:
  type: ClusterIP
  selector:
    app: gm-console
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Horizontal Pod Autoscaler — CPU-based, conservative ceiling.
# gm-console is a thin reverse-proxy + static SPA; it is unlikely to be CPU
# bound. Scale on CPU is fine; memory rarely moves.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gm-console
  labels:
    app: gm-console
    tier: edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gm-console
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
---
# PodDisruptionBudget — keep at least one pod serving during voluntary
# disruptions (node drains, upgrades). minAvailable=1 is safe with 2 replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gm-console
  labels:
    app: gm-console
    tier: edge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gm-console
