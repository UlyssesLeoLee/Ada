[package]
name = "ada-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Independent test scaffolding crate: in-memory mocks, golden fixtures, HTTP/OTLP capture, TDS templates. NOT wired into production crates — sample/standalone only."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_mock"
path = "src/lib.rs"

# Cargo 1.85+ lesson (mirrors ada-telemetry): explicit [[test]] so
# `cargo test --workspace` discovers the integration target even when
# [lib] has an explicit `path = ...`.
[[test]]
name = "sample_mock_usage"
path = "tests/sample_mock_usage.rs"

[features]
default = []
# `server` enables the `FakeOtlpServer` TcpListener module and its
# integration test. It pulls in no extra dependency: the module is
# `std::net` + `std::thread` only, by design (see src/server/mod.rs).
# Off by default so `cargo build` stays cheap for consumers that only
# need pure-data helpers (mocks, fixtures, builders).
server = []

[dependencies]
# In-memory primitives only — no tokio, no async runtime, no HTTP
# client. Keeps the crate cheap to compile and forces sample
# consumers to keep their mocks deterministic.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# ACI 跨项目 emitter (per ULYS-191 §4.3.4 brief v0.1)
aci-emitter = { workspace = true }

# No `time` dependency: this file previously declared an optional
# `time = "0.3"` behind `server`, justified as "FakeOtlpServer payload
# builder stamps RFC3339 timestamps". There is no payload builder --
# the module has no RFC3339 code at all -- and a crate-wide search
# found zero references to the `time` crate, so `server` was forcing
# a second, redundant date/time library (the crate already depends on
# `chrono`) into the build graph for nothing. RFC3339 formatting, if
# the capture layer ever needs it, belongs on `chrono`.

[dev-dependencies]
# Only the workspace's `ada-core` types — the rest of the workspace
# is intentionally NOT pulled in. This crate is a standalone
# reference, not a dev-dep target.
ada-core = { path = "../ada-core", version = "0.1.0" }
[lints]
workspace = true
