[package]
name = "ada-m13-api-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "M-13: API Gateway. axum + utoipa (D-11). REST + WebSocket. JWT auth (D-07)."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_m13_api_gateway"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# M-12 v0.5.0 server-side reconciliation smoke test. Registered
# explicitly per the B2 lesson: when [lib] has a `path` and
# tests/*.rs is non-trivial, [[test]] makes the target visible
# to `cargo test --workspace`. The test pulls m12 with the
# `server` feature (see [dev-dependencies]).
[[test]]
name = "reconcile_smoke"
path = "tests/reconcile_smoke.rs"

[dependencies]
ada-core = { path = "../ada-core" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
utoipa = { version = "4", features = ["axum_extras"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
# Phase 4 distributed-trace support: M-13's outbound
# spans already flow through `tower-http`'s `TraceLayer`
# (the `trace` feature above) which carries the inbound
# W3C `traceparent` header. The M-13-internal layer is
# wired into the global subscriber by `ada-telemetry`
# v0.2.0 (per WT-1, commit `ab5d4c9`); spans reach the
# local OTel Collector via the OTLP exporter. We do not
# add an extra axum-tracing-opentelemetry dep here —
# the upstream crate is 0.12.0-alpha.7 (unstable) and the
# W3C propagation is already covered by tower-http.

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# M-12 v0.5.0 server-side reconciliation smoke tests. Pulled in
# only for `tests/reconcile_smoke.rs` (dev-deps don't affect
# `cargo build` of the lib / bin). The `server` feature gates
# the `reconcile_canvas_state` API; without it the test file
# would not compile.
ada-m12-canvas-editor = { path = "../ada-m12-canvas-editor", features = ["server"] }

[lints]
workspace = true
