[package]
name = "gm-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
authors = ["Ada Project Team"]
description = "gm-console — commercial-grade Web dashboard and operations console for Ada platform"
repository = "https://github.com/UlyssesLeoLee/ada"
homepage = "https://ada.kanvas.dev"
readme = "README.md"

[lib]
name = "gm_console"
path = "src/lib.rs"

[[bin]]
name = "gm-console-server"
path = "src/bin/server.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `rust-embed = "8"` used to live here. Nothing in the crate references
# `rust_embed` or `RustEmbed` -- not in src/, not in tests/ -- and the
# static handler in routes.rs reads GM_CONSOLE_STATIC_DIR off disk at
# request time, which is the opposite of embedding. It was a dead
# dependency: compiled into every gm-console build, including the images,
# and never called.
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
bytes = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"

# NOTE: the release profile that used to live here was silently ignored.
# Cargo only honours `[profile.*]` at the workspace root, and the root
# Cargo.toml already declares an identical `[profile.release]`
# (opt-level 3, lto = "thin", codegen-units = 1, strip = "debuginfo").
# Keeping a copy here just made every cargo invocation in the workspace
# print "profiles for the non root package will be ignored".
