# ----------------------------------------------------------------------
# Phase 0-1 OTLP exporter feature flag (per DOC-OBS-002 §2.1, 11-phased-
# rollout.md §4). This is a **stub only** for now; the real implementation
# is owned by the WT-1 worker ("ada-telemetry v0.2.0") and the
# observability/ worker (this branch) must not pre-empt it.
#
# To enable in a follow-up:
#   1. Land WT-1 (ada-telemetry v0.2.0) first.
#   2. Uncomment the [features] block below.
#   3. Add the matching dependencies from the WT-1 PR.
#
# Adding the feature here lets `cargo check --workspace` keep the
# workspace valid while Phase 0-1 ships the docker-compose stack that
# the v0.2.0 exporter will push to.
# ----------------------------------------------------------------------
# [features]
# default = []
# # Phase 1: enable the OTLP HTTP exporter so the 18 Rust crates can
# # push metrics / logs / traces to the local otel-collector on
# # :4317/:4318. The actual SDK binding is WT-1's scope; this flag
# # gates the integration tests.
# prometheus = ["dep:prometheus", "dep:opentelemetry", "dep:opentelemetry-prometheus"]
#
# [dependencies]
# # Phase 1 — wired by WT-1, listed here as a reference.
# prometheus = { version = "0.13", optional = true }
# opentelemetry = { version = "0.24", optional = true }
# opentelemetry-prometheus = { version = "0.16", optional = true }
