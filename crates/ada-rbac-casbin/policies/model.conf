# casbin RBAC model with domains (tenants) and ABAC attribute bag.
#
# Request fields:
#   r.sub      — role token (e.g. "role:owner", "role:admin"). The
#                api-gateway resolves `UserId -> Vec<Role>` before
#                dispatching into the enforcer; the enforcer itself
#                is role-keyed.
#   r.obj      — resource identifier (e.g. "canvas:<id>" or "*").
#   r.act      — canonical `Action` token ("read" / "write" /
#                "execute" / "delete" / "share_manage").
#   r.tenant   — tenant id this call is scoped to.
#   r.is_owner — "true" if the principal is the tenant owner.
#
# Effect:
#   e = allow  when:
#     * the request role `r.sub` matches the policy `p.sub`, OR the
#       request is an Owner wildcard (`role:*`) and the policy allows.
#     * `p.obj` matches `r.obj` via keyMatch.
#     * `p.act == r.act`.
#     * `p.tenant == r.tenant` or `p.tenant == "*"` (cross-tenant
#       rules permitted only with an explicit wild card).
#     * the policy line's `is_owner` field is `"*"` or matches
#       `r.is_owner` literal.
#
# The `g` rows are used for cascading role inheritance: a user
# with `role:owner` automatically satisfies `role:admin` /
# `role:editor` etc. via `g(role:owner, role:admin)`. The base
# policy file declares these as a self-looping ladder.
[request_definition]
r = sub, obj, act, tenant, is_owner

[policy_definition]
p = sub, obj, act, tenant, is_owner

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && r.act == p.act && (p.tenant == r.tenant || p.tenant == "*") && (p.is_owner == r.is_owner || p.is_owner == "*")
