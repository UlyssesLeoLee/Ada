# casbin RBAC model with domains (tenants) and ABAC attribute bag.
#
# Request fields:
#   r.sub      — role token (e.g. "role:owner", "role:admin"). The
#                api-gateway resolves `UserId -> Vec<Role>` before
#                dispatching into the enforcer; the enforcer itself
#                is role-keyed.
#   r.obj      — resource identifier (e.g. "canvas:<id>" or "*").
#   r.act      — canonical `Action` token ("read" / "write" /
#                "execute" / "delete" / "share_manage").
#   r.tenant   — tenant id this call is scoped to.
#   r.is_owner — "true" if the principal is the tenant owner.
#
# Effect:
#   e = allow  when:
#     * the request role `r.sub` matches the policy `p.sub`, OR the
#       request is an Owner wildcard (`role:*`) and the policy allows.
#     * `p.obj` matches `r.obj` via keyMatch.
#     * `p.act == r.act`.
#     * `p.tenant == r.tenant` or `p.tenant == "*"` (cross-tenant
#       rules permitted only with an explicit wild card).
#     * the policy line's `is_owner` field is `"*"` or matches
#       `r.is_owner` literal.
#
# NOTE ON OWNERSHIP: every row in `base_policy.csv` sets `is_owner` to
# `"*"`, so the clause above is true unconditionally and the policy
# layer does not gate anything on ownership. The gate lives in Rust
# instead — `ada_rbac_casbin::contract::requires_ownership` is applied
# by both evaluators before this model is consulted, so `Delete` is
# refused unless `r.is_owner == "true"`. This used to be documented the
# other way round, which is how the casbin evaluator ended up letting
# `role:owner` delete objects it did not own while the hand-rolled
# evaluator correctly refused.
#
# The `g` rows are used for cascading role inheritance: a user
# with `role:owner` automatically satisfies `role:admin` /
# `role:editor` etc. via `g(role:owner, role:admin)`.
#
# The CSV does **not** contain them. `casbin_impl.rs` adds the
# ladder programmatically from its `ROLE_LADDER` constant after
# `Enforcer::new` loads the adapter, because `add_grouping_policy`
# needs a `&mut` enforcer. An earlier version of this comment said
# the base policy file declared them as a self-looping ladder, which
# is false -- and this file has already been the source of one wrong
# belief about what the policy layer does (the `is_owner` note
# above), so the accurate version is the one worth keeping.
[request_definition]
r = sub, obj, act, tenant, is_owner

[policy_definition]
p = sub, obj, act, tenant, is_owner

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && r.act == p.act && (p.tenant == r.tenant || p.tenant == "*") && (p.is_owner == r.is_owner || p.is_owner == "*")
