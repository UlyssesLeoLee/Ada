[package]
name = "ada-rbac-casbin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RBAC + ABAC wrapper around ada-m11-rbac-collab. v0.5.0 swaps the internal evaluator to casbin 2.x with a notify file watcher (see README)."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[features]
# The evaluator is a two-way function of the `hand-rolled` feature:
#
#   features         evaluator
#   ---------------  ---------------------------------------------
#   (default = [])   casbin 2.x, on every platform
#   hand-rolled      the hand-rolled evaluator, on every platform
#
# `default = []` (rather than the previous `default = ["hand-rolled"]`)
# because casbin is the production evaluator. The old default shipped
# the hand-rolled evaluator everywhere, and that evaluator resolved
# every subject to `Role::Owner`.
#
# There used to be a third configuration: a target-gated build with no
# evaluator at all, which returned a hard error. That row is gone. It
# existed because the manifest claimed `casbin` transitively needed
# `openssl-sys`, which is false -- casbin 2.20 with
# `default-features = false` depends only on async-trait, fixedbitset,
# getrandom, hashlink, once_cell, parking_lot, petgraph, regex, rhai,
# serde, serde_json, thiserror and tokio, all pure Rust. Verified by
# building it on x86_64-pc-windows-msvc: 4m20s, zero errors, zero
# OpenSSL. The gate's real cost was that the production evaluator could
# only ever be compiled on Linux, and this repository's Linux CI had
# been failing to start any job at all, so it was not compiled
# anywhere.
#
# The `casbin` feature that used to be declared here has been REMOVED.
# Nothing in `src/` ever read `cfg(feature = "casbin")`; the test
# references to it have been re-gated onto the real casbin
# configuration, so those assertions now actually compile instead of
# sitting behind a flag nobody set.
default = []
hand-rolled = []

[lib]
name = "ada_rbac_casbin"
path = "src/lib.rs"

[[test]]
name = "import_smoke"
path = "tests/import_smoke.rs"

[[test]]
name = "enforce_smoke"
path = "tests/enforce_smoke.rs"

[[test]]
name = "abac_smoke"
path = "tests/abac_smoke.rs"

[[test]]
name = "hot_reload_smoke"
path = "tests/hot_reload_smoke.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "hot_reload_real"
path = "tests/hot_reload_real.rs"

[dependencies]
ada-core = { path = "../ada-core", version = "0.1.0" }
ada-m11-rbac-collab = { path = "../ada-m11-rbac-collab", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# v0.5.0: real casbin 2.x adapter + notify-based file watcher.
# casbin's `Enforcer::new` is async (rhai default engine); we bring
# `tokio` in as a regular dep purely for the runtime handle so the
# public API can stay synchronous.
#
# `default-features = false` matters here: the default feature set is
# what would drag in the network adapters. With it off, casbin's only
# dependencies are async-trait, fixedbitset, getrandom, hashlink,
# once_cell, parking_lot, petgraph, regex, rhai, serde, serde_json,
# thiserror, tokio and wasm-bindgen-test -- all pure Rust, all
# cross-platform, no OpenSSL and no system libraries. A previous
# revision of this manifest carried a comment claiming the opposite and
# gated casbin behind `cfg(target_os)`, which needlessly confined the
# production evaluator to Linux and macOS.
notify = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
casbin = { version = "2.20", default-features = false, features = ["runtime-tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true