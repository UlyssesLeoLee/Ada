[package]
name = "ada-rbac-casbin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RBAC + ABAC wrapper around ada-m11-rbac-collab. v0.5.0 swaps the internal evaluator to casbin 2.x with a notify file watcher (see README)."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[features]
# The evaluator is a three-way function of (feature, target):
#
#   target            features         evaluator       Enforcer::from_policy_set
#   ----------------  ---------------  --------------  -----------------------------
#   linux / macOS     (default = [])   casbin          builds the casbin enforcer
#   linux / macOS     hand-rolled      hand-rolled     builds the hand-rolled enforcer
#   any other target  (default = [])   none            Err(UnsupportedEvaluator)
#   any other target  hand-rolled      hand-rolled     builds the hand-rolled enforcer
#
# So a Linux/macOS build needs NO flags, and every other target MUST
# pass `--features hand-rolled`. A build that falls into the third row
# has no evaluator at all: it compiles, and every `Enforcer` /
# `HotReload` constructor returns a hard error. That is deliberate --
# a misconfigured build must fail loudly instead of silently
# authorizing everything.
#
# `default = []` (rather than the previous `default = ["hand-rolled"]`)
# because casbin is the intended production evaluator on the
# platforms that can link it. The old default shipped the hand-rolled
# evaluator everywhere, and that evaluator resolved every subject to
# `Role::Owner`.
#
# The `casbin` feature that used to be declared here has been REMOVED.
# Nothing in `src/` ever read `cfg(feature = "casbin")`; the two test
# references to it have been re-gated onto the real casbin
# configuration (`!hand-rolled` + linux/macOS), so those assertions now
# actually compile instead of sitting behind a flag nobody set. It
# could not be wired in as a third selector input either, because the
# matrix above requires Linux/macOS to reach casbin with no extra flags.
#
# `casbin` itself remains declared under the [target.'cfg(...)']
# tables below and is untouched.
default = []
hand-rolled = []

[lib]
name = "ada_rbac_casbin"
path = "src/lib.rs"

[[test]]
name = "import_smoke"
path = "tests/import_smoke.rs"

[[test]]
name = "enforce_smoke"
path = "tests/enforce_smoke.rs"

[[test]]
name = "abac_smoke"
path = "tests/abac_smoke.rs"

[[test]]
name = "hot_reload_smoke"
path = "tests/hot_reload_smoke.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "hot_reload_real"
path = "tests/hot_reload_real.rs"

[[test]]
name = "unsupported_target"
path = "tests/unsupported_target.rs"

[dependencies]
ada-core = { path = "../ada-core", version = "0.1.0" }
ada-m11-rbac-collab = { path = "../ada-m11-rbac-collab", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# v0.5.0: real casbin 2.x adapter + notify-based file watcher.
# casbin's `Enforcer::new` is async (rhai default engine); we bring
# `tokio` in as a regular dep purely for the runtime handle so the
# public API can stay synchronous.
#
# casbin + notify are optional deps gated behind the `casbin`
# feature and `[target.cfg(target_os)]` below — casbin's transitive
# openssl-sys crate needs system OpenSSL libs not present on every
# Windows dev box.
notify = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
casbin = { version = "2.20", default-features = false, features = ["runtime-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
casbin = { version = "2.20", default-features = false, features = ["runtime-tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true