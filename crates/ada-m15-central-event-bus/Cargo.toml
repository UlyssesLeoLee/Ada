[package]
name = "ada-m15-central-event-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "M-15: Central event bus. Pub/Sub. at-least-once + idempotent (D-07)."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_m15_central_event_bus"
path = "src/lib.rs"

# B2 lesson: Cargo 1.85+ silently drops integration test targets
# declared only via the implicit `tests/*.rs` discovery when the [lib]
# block also has an explicit `path = ...`. The `[[test]]` block makes
# the test target explicit so `cargo test --workspace` actually runs
# `tests/integration.rs`. Pre-applied here per the B2 worker retro.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
ada-core = { path = "../ada-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = "1"

[lints]
workspace = true
