[package]
name = "ada-remediation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Auto-remediation runbook engine for observability Phase 8. Maps Alertmanager alerts to declarative remediation actions with cooldown + retry semantics. Sources of truth: docs/observability/11-phased-rollout.md §10 and docs/observability/12-auto-remediation.md."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_remediation"
path = "src/lib.rs"

# B2 lesson (mirrored from ada-telemetry): explicit [[test]] so
# cargo test --workspace picks up tests/integration.rs even though
# the [lib] block pins src/lib.rs.
[[test]]
name = "remediation_e2e"
path = "tests/remediation_e2e.rs"

[dependencies]
# Always-on: core types + serialization for runbook configs and history
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"

# HTTP server: axum 0.7 (same version as used by ada-telemetry trace
# HTTP endpoint and ada-m13-api-gateway; we keep the dep graph homogeneous).
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }

# Time / id
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Async-friendly shared state
parking_lot = "0.12"

# v0.7.0 hardening: metrics facade + Prometheus text-format renderer.
# Same versions as ada-telemetry (see `ada-telemetry/Cargo.toml`
# `prometheus` feature). Default-features = false so we do not
# pull in the optional HTTP listener (we render Prometheus text
# from inside the axum `/metrics` route instead).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# v0.7.0 hardening: keyed-hash MAC for webhook HMAC auth. v0.7.0
# uses blake3 keyed-hash (the `hmac`/`sha2`/`subtle` crates are
# not in the offline `Cargo.lock`; v0.7.1 swaps to HMAC-SHA256 +
# constant-time compare once those crates are vendored).
base64 = "0.22"
blake3 = "1.8"

# v0.7.0 hardening: constant-time compare for the
# shared-secret webhook token. Reused as a transitive
# dep of `blake3`, so this line does not pull any new
# crate into the offline cache.
constant_time_eq = "0.4"

# v0.7.0 hardening: object-safe async trait for `StepExecutor`.
# `dyn StepExecutor` is held by the engine, so the impl needs
# `#[async_trait]` (native RPITIT is not object-safe).
async-trait = "0.1"

[dev-dependencies]
# In-memory store for the E2E test does not need sqlx; we exercise
# the full engine through public APIs.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
