[package]
name = "ada-m12-canvas-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "M-12: Canvas editor. Nodes, edges, edit history with undo/redo. Compiles to WASM and integrates with Bevy 0.14."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_m12_canvas_editor"
path = "src/lib.rs"
# `crate-type = ["cdylib", "rlib"]` 是 wasm-pack 编译 WebAssembly
# 的前提(`cdylib` 输出 .wasm,`rlib` 保留 native 默认构建以免
# 拖累 5 门 CI 的检查/测试时间)。`cdylib` 本身在 native 目标下
# 不会改变产物(.so / .dll / .dylib 之类),但会导致 Rust 为每
# 个 crate-type 重新编译一次 — 接受这个 trade-off 是为了
# `wasm-pack build` 不报错。注意 `cdylib` 在 Windows 上会尝试
# 链接 cdylib,需要 `wasm32-unknown-unknown` 目标才能编出 .wasm;
# native 目标 (x86_64-pc-windows-msvc) 仍然可以跑 `cargo build`
# 走 rlib,wasm-pack 才走 cdylib。
crate-type = ["cdylib", "rlib"]

# B2 lesson: Cargo 1.85+ silently drops integration test targets
# declared only via the implicit `tests/*.rs` discovery when the [lib]
# block also has an explicit `path = ...`. The `[[test]]` block makes
# the test target explicit so `cargo test --workspace` actually runs
# `tests/integration.rs`. Pre-applied here per the B2 worker retro.
[[test]]
name = "integration"
path = "tests/integration.rs"

# B2 lesson (repeated for `crdt_sync`): explicit `[[test]]`
# block so `cargo test --workspace` actually runs the
# integration test under `tests/crdt_sync.rs` (Cargo 1.85+
# silently drops tests/* when `[lib]` also has an explicit
# `path = ...`). The test itself is feature-gated (only
# meaningful with `--features crdt`); see the `#[cfg]`
# at the top of `tests/crdt_sync.rs`.
[[test]]
name = "crdt_sync"
path = "tests/crdt_sync.rs"
required-features = ["crdt"]

[dependencies]
ada-core = { path = "../ada-core" }
# `tokio` baseline 是 wasm-friendly 子集(`macros,sync,time`)—
# 这样 `--target wasm32-unknown-unknown` 直接可编。native
# (含 CI default) 通过下面的 `[target.'cfg(not(...))']` 块
# 累加 `rt-multi-thread` feature,保留多线程 runtime 能力。
# 为什么不把 `rt-multi-thread` 放 baseline:`rt-multi-thread`
# 在 wasm 上 `compile_error!` 直接拒绝编译。
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
# Yrs (Yjs Rust port, MIT) — M-12 v0.6.0 CRDT sync backend.
# Pinned to 0.18 (latest stable at the time of v0.6.0; the cached
# registry only has 0.18.8, so no `*` wildcard is used). The
# default feature set pulls in fastrand/js + serde/derive + thiserror
# — none of those break the WASM build because yrs itself does not
# pull wasm-bindgen. WASM-specific bindings (if any future release
# ships them) would arrive via a dedicated feature flag we add
# then. See `crates/ada-m12-canvas-editor/CRDT.md` for the
# integration design.
yrs = "0.18"
# WASM 下 `uuid` 需要 explicit randomness source;通过 feature
# gate 拉入 `uuid/js`(用 crypto.getRandomValues),native build
# 不受影响。
# (见 [features] 表 `wasm` 行尾的 "uuid/js")

# === Optional WASM + Bevy integration deps ===
# Per `docs/decisions/02-design-adrs.md` D-02 (sandbox WASM),
# D-04 (Bevy 0.14 stable), D-05 (WASM 8 MB / gzip 3 MB).
#
# 所有 optional deps 默认不拉,保证 `cargo build` / `cargo test`
# (default features) 走纯 Rust 路径,不引入 wasm-bindgen / bevy
# 的编译期负担。feature gate 见下。

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
bevy_ecs = { version = "0.14", optional = true, default-features = false }
bevy_app = { version = "0.14", optional = true, default-features = false }
# `wasm-bindgen-test` 必须是 regular dep 才能做 optional;不能
# 放在 `[dev-dependencies]`。`wasm-test` feature gate 控制
# 它是否被拉入,所以 default build 不会触达。
wasm-bindgen-test = { version = "0.3", optional = true }
# === Bevy + egui inspector integration (M-12 v0.3.0) ===
# 任务: m12 canvas editor v0.3.0 升级,在 Bevy 0.14 App 中提供
# egui 右侧属性面板 + 拖拽事件,实现 ECS↔Canvas 双向同步。
#
# 版本配套 (实测 bevy_egui 0.28 ↔ egui 0.28 ↔ bevy 0.14):
# - `bevy_egui 0.28` re-export `egui 0.28`,与 bevy 0.14 配套
#   (用户提示中写的 egui "0.32" 实为误;以 bevy_egui 0.28 实
#   际依赖为准,见 docs.rs/bevy_egui/0.28.0/dependencies)
# - `default-features = false` 关闭 bevy_egui 的 `render` /
#   `manage_clipboard` / `open_url` features,避免拉入
#   bevy_render(完整渲染管线,WASM 体积敏感,违反 D-05 8 MB
#   ceiling)
# - 不引入 egui_extras(用户提示中标注"可选,用于 syntax
#   highlighting"; inspector 面板用不到,移除以减少编译负担)
#
# 行为:
# - `bevy_egui` feature 是 native-only(走 default build 路径
#   不会被拉入,WASM build 不变);只用于 native 拖拽 + egui
#   inspector 集成测试。
# - WASM 5 门(走 `--features wasm`)不拉 bevy_egui / egui,
#   所以 pkg/ada_m12_canvas_editor_bg.wasm 大小不变。
bevy_egui = { version = "0.28", default-features = false, optional = true }
egui = { version = "0.28", default-features = false, optional = true }

# Native (x86_64-pc-windows-msvc / x86_64-unknown-linux-gnu) 累加
# `rt-multi-thread` 给 tokio — 保留现有 m12 native 行为。wasm32
# target 不进入此块,走 baseline `macros,sync,time`。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# dev-deps 同样分平台 — wasm test build 不需要 rt-multi-thread。
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# === Features ===
# - default: 仅 Rust 原生,不带任何 WASM / Bevy 编译负担。
#   默认 5 门(cargo check/test/clippy/fmt + wasm-pack build)
#   的"5 门"指 default 路径。
# - wasm: 拉 wasm-bindgen / js-sys / serde-wasm-bindgen /
#   console_error_panic_hook,启用 `src/wasm.rs` 暴露 JS 绑定。
# - bevy: 拉 bevy_ecs + bevy_app,启用 `src/bevy_plugin.rs` +
#   `src/bevy_bridge.rs` 暴露 Bevy 0.14 Plugin。
# - bevy_egui: 在 bevy 基础上加 bevy_egui + egui,启用
#   `src/egui_integration.rs` 暴露 Inspector + 拖拽事件。这是
#   M-12 v0.3.0 新增 feature,实现 ECS↔Canvas 双向 push。
#   default off:native 拖拽测试场景用,WASM build 不拉。
# - full: 同时启用 wasm + bevy,产出最大体积的 WASM (前端单
#   bundle 场景)。
# - wasm-test: 在 wasm feature 之上加 wasm-bindgen-test,供
#   `wasm-pack test --headless --chrome` 跑浏览器内测试。
# - server: M-12 v0.5.0 server-side reconciliation (server_recon.rs)
#   + m13 reconcile endpoint integration tests。default off —
#   不污染 5 门 default-build 路径。`serde` 已在主依赖列表
#   (非 optional),所以这里只列 `serde/derive` 作为 re-export
#   reminder,实际不引入新依赖。`chrono` 不需要(无时间戳字段
#   — v0.5.0 LWW 策略按 server 时钟权威解析,client 不参与
#   排序),留作 v0.6.0 CRDT 升级时再加。
[features]
default = []
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
    # uuid 1.x 在 wasm32 上要求显式声明 randomness source;
    # 用 `uuid/js` 让 uuid 调 `crypto.getRandomValues`。
    "uuid/js",
]
bevy = ["dep:bevy_ecs", "dep:bevy_app"]
# bevy_egui 必须 transitively 拉 bevy + egui(be 自身 crate 拉
# 整个 bevy);bevy_egui = bevy + egui。详见 `src/egui_integration.rs`
# 顶部注释对 native-only 行为 + D-05 体积约束的说明。
bevy_egui = ["bevy", "dep:bevy_egui", "dep:egui"]
full = ["wasm", "bevy"]
wasm-test = ["wasm", "dep:wasm-bindgen-test"]
# v0.5.0 server-side reconciliation. Currently introduces no new
# deps (serde is already non-optional in [dependencies]); the
# feature flag exists to gate the `pub mod server_recon` block
# and the integration tests under `tests/integration.rs` (which
# use `#[cfg(feature = "server")]`).
server = []
# v0.6.0 CRDT (Yrs) sync. Pulls in `yrs` (already declared in
# [dependencies] above — this flag only gates the `pub mod
# crdt` block and the `tests/crdt_sync.rs` integration test).
# Default off: 5-gate CI default build does not exercise CRDT.
crdt = []
# v0.6.0 rename of the v0.5.0 `server` feature. `server` is kept
# as a stable alias for cross-crate compat (m13 etc.); new
# crates should depend on `legacy-lww` for clarity that this
# path is on the deprecation roadmap (replaced by `crdt`).
# `server` and `legacy-lww` are functionally equivalent in
# v0.6.0; both enable the same `pub mod server_recon` block.
legacy-lww = []
# v0.7.0: keep the v0.6.0 YArray-of-YMap schema available
# behind a feature flag for one release as a rollback path.
# v0.8.0 will remove this flag. New code should use the
# v0.7.0 YMap-keyed-by-uuid schema in `crdt.rs` (the default
# `crdt` feature flag).
legacy-array = ["crdt"]

[lints]
workspace = true
