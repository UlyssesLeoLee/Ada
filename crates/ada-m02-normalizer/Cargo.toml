[package]
name = "ada-m02-normalizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "M-02: Data normalization. Convert raw messages to standard NJSON schema."
readme = "README.md"
categories.workspace = true
keywords.workspace = true
publish = false

[lib]
name = "ada_m02_normalizer"
path = "src/lib.rs"

# B2 lesson: Cargo 1.85+ silently drops integration test targets
# declared only via the implicit `tests/*.rs` discovery when the [lib]
# block also has an explicit `path = ...`. The `[[test]]` block makes
# the test target explicit so `cargo test --workspace` actually runs
# `tests/integration.rs`. Pre-applied here per the B2 worker retro.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
ada-core = { path = "../ada-core" }
ada-m01-acquisition = { path = "../ada-m01-acquisition" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
