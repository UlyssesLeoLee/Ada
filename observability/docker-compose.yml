# Ada observability stack — Phase 0 + Phase 1.
#
# 1-key-up: brings up Prometheus, Loki, Grafana, Jaeger,
# OTel collector, Promtail, node-exporter, and the
# postgres-exporter. Tag pinning follows
# DOC-OBS-002 §3 技術スタック (Prometheus 2.50+, Loki 2.9+,
# Grafana 11.x, Jaeger 1.55, OTel collector 0.104+).
#
# Volume layout: the `*-data` named volumes persist across
# `docker compose down` but NOT across `docker compose down
# -v`. Phase 6+ switches to hostPath / CSI volumes; for
# Phase 0-1 the named volume is the right trade-off.
#
# Service ports (host side):
#   3000   Grafana
#   9090   Prometheus
#   3100   Loki
#   9080   Promtail (status only)
#   16686  Jaeger UI
#   4317   OTel collector (OTLP gRPC)  -- the primary
#                                          ingress for the
#                                          18 Rust crates
#   4318   OTel collector (OTLP HTTP)
#   9100   node-exporter
#   9187   postgres-exporter
#   14269  OTel collector health
#
# Usage:
#   docker compose -f observability/docker-compose.yml up -d
#   bash observability/scripts/init.sh   # shortcut
#
# See observability/README.md for the validation steps.

name: ada-observability

services:

  # --------------------------------------------------------------------
  # Prometheus — metrics storage.
  #   tag: v2.54.1 (Loki-compatible, ≥ 2.50)
  #   retention: 15d (DOC-OBS-002 §2.3)
  #   scrape config: ./prometheus/prometheus.yml
  #   alert rules: ./prometheus/alerts/*.yml
  # --------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ada-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------
  # Loki — log storage. v3.2.2 (LTS-aligned with 2.9+ schema).
  #   30d retention, filesystem store, single node.
  # --------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.2
    container_name: ada-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------
  # Promtail — log shipper. Reads the docker-compose service
  # logs and pushes to Loki on :3100.
  # --------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.2
    container_name: ada-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9080:9080"
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy

  # --------------------------------------------------------------------
  # Grafana — UI / dashboards. 11.3.0 (LTS-aligned with the
  # 11.x family in DOC-OBS-002 §3 技術スタック).
  #   admin password from .env (default: ada / ada).
  #   auto-provisions datasources + dashboards at boot
  #   so the stack is "1-key-up" without any UI click.
  # --------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ada-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-ada}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ada}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

  # --------------------------------------------------------------------
  # Jaeger — distributed trace storage + UI. 1.55.0 with
  # native OTLP support (Jaeger v1.35+).
  #   UI on :16686, Jaeger gRPC :14250, OTLP :4317/:4318.
  #   Storage: in-memory (Phase 0-1). Phase 6+ switches to
  #   ES / Kafka.
  # --------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.55.0
    container_name: ada-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - METRICS_BACKEND=prometheus
      - LOG_LEVEL=info
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # Jaeger gRPC (thrift)
      - "4317:4317"    # OTLP gRPC (native)
      - "4318:4318"    # OTLP HTTP
    networks:
      - observability

  # --------------------------------------------------------------------
  # OpenTelemetry Collector — single ingress for all four
  # signals. Routes to Prometheus / Loki / Jaeger.
  # Config: ./jaeger/otel-collector-config.yaml
  # --------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: ada-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./jaeger/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health
      - "8889:8889"   # Prometheus self
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - jaeger

  # --------------------------------------------------------------------
  # node-exporter — host metrics. In a dev stack this lives
  # in the same network; in K8s it would be a DaemonSet.
  # --------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ada-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)"
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    networks:
      - observability

  # --------------------------------------------------------------------
  # postgres-exporter — PG 18.6 metrics. The data source
  # name + credentials come from .env (defaults: postgres,
  # ada, ada, ada). The exporter is the *only* component
  # that needs the credentials.
  # --------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ada-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-ada}:${POSTGRES_PASSWORD:-ada}@postgres:5432/${POSTGRES_DB:-ada}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - observability
    # No `depends_on` here; the exporter is optional in
    # Phase 0-1 and the prometheus job keeps `up == 0`
    # in the meantime.

  # --------------------------------------------------------------------
  # Alertmanager — Phase 6 alert routing layer.
  #   image: prom/alertmanager:v0.27.0 (per
  #          10-deployment-design.md §4.6)
  #   config: ./alertmanager/alertmanager.yml + ./alertmanager/templates/
  #   port: 9093 (UI + API)
  #   silences / inhibit state: alertmanager-data named volume
  #   no smtp / pagerduty keys in YAML — the config file uses
  #   ${...} placeholders that docker-compose interpolates from
  #   .env. The defaults below are safe in dev (no real
  #   integration) and must be overridden in prod.
  # --------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ada-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - observability
    environment:
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-PLACEHOLDER_PAGERDUTY_ROUTING_KEY}
      - SLACK_WEBHOOK_WARNINGS=${SLACK_WEBHOOK_WARNINGS:-https://hooks.slack.com/services/PLACEHOLDER}
      - SLACK_WEBHOOK_CLUSTER=${SLACK_WEBHOOK_CLUSTER:-https://hooks.slack.com/services/PLACEHOLDER}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-smtp.example.com:587}
      - SMTP_FROM=${SMTP_FROM:-alerts@ada.local}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-true}
      - SMTP_AUTH_USERNAME=${SMTP_AUTH_USERNAME:-alerts@ada.local}
      - SMTP_AUTH_PASSWORD=${SMTP_AUTH_PASSWORD:-PLACEHOLDER_SMTP_PASSWORD}
      - ALERT_DIGEST_TO=${ALERT_DIGEST_TO:-oncall@ada.local}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy

  # --------------------------------------------------------------------
  # MinIO — S3-compatible long-term storage. Phase 6 ships
  # MinIO + the `mc` init container (below). Bucket creation
  # + lifecycle policy live in ./minio/init-bucket.sh which
  # the mc container runs once at boot.
  #   API: 9000 (S3 protocol)
  #   Console: 9001 (web UI)
  #   data: minio-data named volume
  # --------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-44Z
    container_name: ada-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------
  # mc — MinIO init container. Runs the bucket-bootstrap
  # script and exits. restart: "no" so the script is not
  # re-run on every docker restart (the script is
  # idempotent, but exit-after-success is the conventional
  # pattern for init containers).
  # --------------------------------------------------------------------
  mc:
    image: minio/mc:RELEASE.2024-10-29T16-01-44Z
    container_name: ada-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "sleep 5 && /scripts/init-bucket.sh"
    volumes:
      - ./minio/init-bucket.sh:/scripts/init-bucket.sh:ro
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=prometheus-tsdb
      - MINIO_RETENTION_DAYS=90
    networks:
      - observability
    restart: "no"

networks:
  observability:
    driver: bridge
    name: ada-observability

volumes:
  prometheus-data:
    name: ada-prometheus-data
  loki-data:
    name: ada-loki-data
  grafana-data:
    name: ada-grafana-data
  alertmanager-data:
    name: ada-alertmanager-data
  minio-data:
    name: ada-minio-data
