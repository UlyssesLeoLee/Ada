# ALT-102 / HighLatency — Sev2 (per 07-alert-policy.md §4.2).
#
# Fires when p99 request latency for any ada-app service
# exceeds 1s sustained over 5 minutes.
#
# Threshold rationale: M-13 SLO is "p99 < 500ms" (08-slo-design
# §3); 1s is 2× the SLO budget and is the boundary at which
# the Phase 1 alert policy decides to page. p99 is computed
# from the histogram `ada_app_request_duration_seconds`
# (DOC-OBS-003 §5.1).

groups:
  - name: high_latency
    interval: 30s
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(ada_app_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: P2
          phase: "0-1+6"
        annotations:
          summary: "{{ $labels.service }} p99 latency > 1s for 5m"
          description: |
            p99 request latency for {{ $labels.service }} has
            been above 1s for 5 minutes (current value:
            {{ $value | humanizeDuration }}).
            SLO target: < 500ms (M-13), < 1s hard limit.
          runbook: "https://wiki.example/runbooks/high-latency"
          dashboard: "http://localhost:3000/d/app-overview"
