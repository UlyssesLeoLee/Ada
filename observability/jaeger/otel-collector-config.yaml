# OpenTelemetry Collector configuration for the Ada stack.
#
# Image: otel/opentelemetry-collector-contrib:0.104.0
# Matches DOC-OBS-002 §3 技術スタック row "Collector
# otel-collector-contrib 0.104+".
#
# This collector is the single ingress for all four
# observability signals. The 18 Rust crates push OTLP
# gRPC here on :4317. The collector then fans the data
# out to the backends:
#   - metrics -> Prometheus (remote_write)
#   - logs    -> Loki
#   - traces  -> Jaeger (gRPC :14250)
#   - metrics -> otel-collector self-metrics -> Prometheus
#
# See 02-architecture.md §1 全体像 for the topology.
# See 11-phased-rollout.md §6 Phase 4 for the rollout
# (traces) — Phase 0-1 keeps the Jaeger exporter
# permissive; tail-sampling lands in Phase 4.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

  # The collector's own Prometheus scrape. Surfaces the
  # standard `otelcol_*` metrics to Prometheus.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: [localhost:8888]

processors:
  # Memory bound. 80% of the container's 1 GiB is the
  # soft limit; 20% is the spike headroom.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Batch OTLP exports. 512 samples / 5s matches the
  # default in 02-architecture.md §4.1 step (2).
  batch:
    timeout: 5s
    send_batch_size: 512

  # Resource enrichment. Per DOC-OBS-002 §4.1 step (3),
  # every signal carries service.name, version, env,
  # tenant_id, k8s.*. The processor below adds the
  # container-level env / hostname and normalizes
  # tenant_id casing.
  resource/env:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert
  attributes/normalize:
    actions:
      - key: tenant_id
        action: normalize
      - key: service.name
        action: normalize

  # Tail sampling (Phase 4). Three policies run in order
  # and combine to decide which traces get archived:
  #   1. errors — keep every trace that contains at least
  #      one ERROR-level span (status_code = ERROR).
  #   2. slow-traces — keep traces where any span's
  #      duration exceeds 1s (Phase 4 threshold; future
  #      phases will lower it as the SLO work in Phase 7
  #      tightens p99 targets).
  #   3. probabilistic — keep 10% of the remaining
  #      traces as a representative sample. The
  #      head/tail split is the Google SRE standard (see
  #      05-tracing-design.md §4.2).
  #
  # `decision_wait: 10s` is the time the collector holds a
  # trace before deciding — sized so the slowest expected
  # request in the 18-crate fleet (~5s) plus headroom fits
  # comfortably.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Metrics -> Prometheus. The remote_write protocol is
  # the production target; the local Prometheus pulls
  # from the collector's own /metrics endpoint via the
  # `prometheus/self` receiver above. In Phase 0-1 we
  # don't enable remote_write because Prometheus scrapes
  # the business crates directly.
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      cluster: ada-dev
      env: dev
    # Add resource attributes as metric labels.
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> Loki. The Loki exporter is the production
  # path; Promtail is a stop-gap (see
  # observability/loki/promtail-config.yaml).
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: otlp
    labels:
      resource:
        service.name: service
        service.namespace: namespace
    headers:
      # Phase 0-1: no auth. Phase 6+ adds a service
      # account token via the `X-Scope-OrgID` header
      # required by the multi-tenant gateway.
      X-Scope-OrgID: "ada-dev"

  # Traces -> Jaeger. Phase 0-1 baseline; the Jaeger
  # UI remains the per-developer trace drill-down.
  # Matches jaeger-config.yaml's service.jaeger_thrift_grpc
  # port.
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Traces -> Tempo. Phase 4 long-term trace store.
  # Tail-sampled traces (errors / slow traces / 10% random)
  # get fanned out to Tempo via OTLP gRPC. Grafana's Tempo
  # data source (see provisioning/datasources/datasources.yml)
  # reads from this exporter's destination.
  #
  # The `sending_queue` is sized for the Phase 4 burst
  # pattern (per 05-tracing-design.md ��4.1: 18 crates
  # x ~10 spans/request x ~50 RPS = ~9000 spans/s peak).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    metrics:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, resource/env, attributes/normalize, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, attributes/normalize, batch]
      exporters: [loki]

    traces:
      receivers: [otlp]
      # tail_sampling is placed *before* batch because it
      # needs to inspect every span before they're grouped
      # into batches (per the OTel Collector's data-flow
      # rule: tail-based samplers must see the full trace).
      processors: [memory_limiter, resource/env, attributes/normalize, tail_sampling, batch]
      # Both Jaeger (per-developer drill-down, Phase 0-1
      # baseline) and Tempo (long-term archive, Phase 4)
      # receive the same sampled trace stream. This is a
      # deliberate duplication: keeping Jaeger in the
      # pipeline is the lowest-risk way to ship Phase 4
      # without changing the dev workflow.
      exporters: [jaeger, otlp/tempo]

  telemetry:
    metrics:
      level: detailed
    logs:
      level: info
