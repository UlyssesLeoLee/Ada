# Grafana 10.x datasource provisioning.
#
# Auto-provisions the four datasources that the Phase 0-1
# dashboards depend on. Grafana picks this file up at boot
# (mounted via docker-compose), so the stack is "1-key-up"
# without any UI click.
#
# UID stability: the UIDs below are referenced from the
# dashboard JSON `__inputs` blocks. Changing them breaks
# provisioning; the four UIDs are part of the Phase 0-1
# public surface.

apiVersion: 1

datasources:
  # --------------------------------------------------------------------
  # Prometheus. Per DOC-OBS-002 §2.3, retention 15d, single
  # replica. URL is the docker-compose service name.
  # --------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: false

  # --------------------------------------------------------------------
  # Loki. 30d retention, single node, filesystem store.
  # --------------------------------------------------------------------
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60

  # --------------------------------------------------------------------
  # Jaeger (UI ships inside the same service at :16686;
  # the Grafana datasource talks to the same backend via
  # the Jaeger HTTP API).
  # --------------------------------------------------------------------
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      timeOut: 60
      tracesToLogsV2:
        datasourceUid: loki

  # --------------------------------------------------------------------
  # PostgreSQL (postgres_exporter scrape). Provisioned so
  # the db-overview dashboard can switch datasource on the
  # fly without a UI trip.
  # --------------------------------------------------------------------
  - name: Postgres
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    user: ada
    secureJsonData:
      password: ada
    jsonData:
      database: ada
      sslmode: disable
      postgresVersion: 1806
      timescaledb: false

  # --------------------------------------------------------------------
  # Alertmanager (Phase 6). Exposes the Alertmanager REST
  # API to Grafana so dashboards can list firing alerts
  # and silences. UID `alertmanager` is referenced from
  # any alert-list panels added in Phase 6+ dashboards.
  # --------------------------------------------------------------------
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # --------------------------------------------------------------------
  # Tempo (Phase 4 — long-term trace store). The HTTP API
  # is the Grafana query path; traceql queries are routed
  # to this datasource. The `tracesToLogsV2` block lets users
  # jump from a span straight to the matching Loki logs,
  # and `tracesToMetrics` jumps to Prometheus exemplars
  # for the same trace. `serviceMap` builds the service
  # topology graph from the trace edges.
  # --------------------------------------------------------------------
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        tags: ['service.name', 'http.method', 'http.target']
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: 'service.name', value: 'service' }]
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
