# Loki 2.9+ single-binary configuration for Ada Phase 0-1.
#
# Per DOC-OBS-002 §2.3 バックエンドレイヤー, Loki is deployed
# as a single Pod (gossip disabled) with filesystem storage
# and a 30d retention. S3 / MinIO are explicitly out of
# Phase 0-1 scope (per 11-phased-rollout.md §3 scope).
#
# The dev container has no TLS, no auth, and listens on the
# container network only. Production migrations land in
# Phase 6+ alongside the helm chart (10-deployment-design.md).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  # grace period for graceful shutdown
  graceful_shutdown_timeout: 30s

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema for log streams. The v11 schema is the current
# default in Loki 2.9+; v12 lands in Loki 3.x (Phase 6+).
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Ruler (log-based alerts) is configured but stays empty in
# Phase 0-1 — the four canonical alerts are in Prometheus,
# not Loki.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Compactor (older chunks). Phase 0-1 keeps the default
# interval; production tuning is Phase 6+.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# 30-day retention per DOC-OBS-002 §2.3.
limits_config:
  retention_period: 30d
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Per-stream limits. Default values are fine for a single-
  # node dev stack; Phase 3 raises them once Phase 3 ships
  # real log traffic.
  max_entries_limit_per_query: 5000
  max_query_series: 500
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

# Operational defaults. Bumped from 5m to 30s to make
# Phase 0-1 alert evaluation snappy.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
