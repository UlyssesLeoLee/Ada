  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans);
      font-size: var(--type-body);
      color: var(--text-body);
      background: linear-gradient(180deg, var(--surface-bg) 0%, var(--surface-card) 100%);
    }
    h1 { color: var(--text-strong); }
    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
    a { color: var(--brand-500); text-underline-offset: 2px; }
    header.site {
      border-bottom: 1px solid color-mix(in srgb, var(--text-strong) 8%, transparent);
      padding: var(--space-3) var(--space-5);
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    header.site .brand-mark {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--text-strong);
      text-decoration: none;
    }
    header.site .brand-mark .dot { color: var(--brand-500); }
    main {
      flex: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-5) var(--space-6);
    }
    h1 {
      font-size: var(--type-h2);
      margin: 0 0 var(--space-2);
      letter-spacing: -0.01em;
    }
    .sub { margin: 0 0 var(--space-5); color: var(--text-faint); font-size: var(--type-small); }
    .field { margin-bottom: var(--space-4); }
    label {
      display: block;
      margin-bottom: var(--space-1);
      font-weight: 600;
      font-size: var(--type-small);
      color: var(--text-strong);
    }
    input {
      width: 100%;

      font: inherit;

      background: var(--surface-card);
      border: 1px solid color-mix(in srgb, var(--text-strong) 16%, transparent);

      transition: border-color var(--dur-fast) var(--ease-standard);
    }
    input:hover { border-color: color-mix(in srgb, var(--brand-500) 45%, transparent); }

      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);

<body>
  <header class="site" role="banner">
    <a class="brand-mark" href="/" aria-label="gm-console home">
      gm<span class="dot">·</span>console
    </a>
  </header>

  <main id="main" tabindex="-1">
    <h1>Sign in</h1>
    <p class="sub">Operations console for the Ada data platform.</p>

    <!-- Novalidate: the browser's own bubbles are less informative than the
         status line, and both agree on which field is wrong. -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               inputmode="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button id="submit" type="submit">Sign in</button>
      <!-- role=status so the message is announced, aria-live for the same
           reason; the token itself is never written here. -->
      <p class="status" id="status" role="status" aria-live="polite" hidden></p>
    </form>
  </main>

  <footer class="site" role="contentinfo">
    <a href="/">Home</a> ·
    <a href="/terms">Terms</a> ·
    <a href="/privacy">Privacy</a>
  </footer>

  <!-- Login. Static page, no framework and no bundler: the repo has no
       package.json at all (see apps/gm-console-web/scripts/SPEC.md and the
       note at the bottom of deploy/docker/gm-console.Dockerfile), so this
       is hand-written against the same tokens as the shell.

       The contract is the one the Flutter client already implements in
       apps/gm-console-app/lib/api/endpoints/auth_api.dart:

         POST /api/v1/auth/login   {"email": ..., "password": ...}
         200                       {"token": "...", "expires_at": "..."}
         401                       ApiUnauthorizedException -> re-auth

       `token` is required and non-empty; a 200 without one is treated as a
       failure rather than as a successful sign-in, because the client
       treats it the same way.

       ## Where the token is stored, and why that is a compromise

       It goes in localStorage under `gm_console_token`. The Flutter client
       uses SecureStorage, which this page cannot: there is no platform
       secret store behind an HTTP response, and inventing a server-side
       session would mean changing the gateway's contract, which is not
       this page's call. localStorage is readable by any script on the
       origin, so a token held here is only as safe as the console's own
       pages. That is an accepted property of a shell that ships no
       third-party script, not a solved problem, and it is the first thing
       to revisit when this page grows a real bundle. -->
  <script>
    (function () {
      'use strict';

      var TOKEN_KEY = 'gm_console_token';
      var EXPIRES_KEY = 'gm_console_token_expires_at';
      var ENDPOINT = '/api/v1/auth/login';

      var form = document.getElementById('login-form');
      var emailEl = document.getElementById('email');
      var passwordEl = document.getElementById('password');
      var submitEl = document.getElementById('submit');
      var statusEl = document.getElementById('status');

      function say(message, state) {
        statusEl.textContent = message;
        if (state) {
          statusEl.setAttribute('data-state', state);
        } else {
          statusEl.removeAttribute('data-state');
        }
        statusEl.hidden = false;
      }

      function busy(on) {
        submitEl.disabled = on;
        submitEl.textContent = on ? 'Signing in...' : 'Sign in';
      }

      // localStorage throws in a private-mode context and when a browser
      // blocks storage for the origin. A sign-in that cannot persist its
      // token would silently drop the user back to this page on the next
      // request, so the failure is reported rather than swallowed.
      function store(key, value) {
        try {
          window.localStorage.setItem(key, value);
          return true;
        } catch (e) {
          return false;
        }
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var email = emailEl.value.trim();
        var password = passwordEl.value;

        if (!email || !password) {
          say('Enter both an email address and a password.', 'err');
          return;
        }

        busy(true);
        say('Signing in...');

        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'content-type': 'application/json', accept: 'application/json' },
          // Same-origin and relative, so this goes through the console's
          // own /api proxy and never needs a CORS preflight.
          body: JSON.stringify({ email: email, password: password })
        }).then(function (response) {
          return response.json().catch(function () {
            // A non-JSON body on a success status is still a contract
            // violation; hand the status to the same check below.
            return null;
          }).then(function (body) {
            return { status: response.status, body: body };
          });
        }).then(function (result) {
          var body = result.body;

          if (result.status === 401 || result.status === 403) {
            // Matches ApiUnauthorizedException / ApiForbiddenException:
            // credentials rejected, so re-auth rather than retry.
            passwordEl.value = '';
            passwordEl.focus();
            say('That email and password combination was not accepted.', 'err');
            return;
          }

          if (result.status < 200 || result.status >= 300) {
            say('Sign-in failed: the service answered ' + result.status + '.', 'err');
            return;
          }

          var token = body && typeof body.token === 'string' ? body.token : '';
          if (!token) {
            say('Sign-in failed: the response carried no token.', 'err');
            return;
          }

          if (!store(TOKEN_KEY, token)) {
            say('Signed in, but this browser refused to store the token.', 'err');
            return;
          }
          // Optional in the client's contract (`DateTime? expiresAt`), so
          // its absence is not an error.
          if (body.expires_at && typeof body.expires_at === 'string') {
            store(EXPIRES_KEY, body.expires_at);
          }

          passwordEl.value = '';
          say('Signed in. Redirecting...', 'ok');
          window.location.assign('/');
        }).catch(function () {
          say('Sign-in failed: the console could not reach the API.', 'err');
        }).then(function () {
          busy(false);
        });
      });
    })();
  </script>
</body>
