<?xml version="1.0" encoding="UTF-8"?>
<!--
  icon-source.svg — gm-console app icon seed
  -----------------------------------------------------------------------------
  Owner:    worker-F (submission artifacts)
  Renders:  ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
            android adaptive icons (foreground + background)
            Play Store 512x512 marketing icon
  Source:   docs/commercial/brand/TOKENS.md (`--brand-500` = #1E88E5)
  License:  AGPL v3 — same as the rest of the Ada platform.

  Composition rules (kept short so the source is reviewable in plain text):
    * 1024x1024 viewBox; circle is the dominant mark; the gm-cipher sits centered.
    * Background: solid brand-500 fill (sRGB).
    * Foreground glyph: white circle with an inset rounded square that
      suggests a "console node".  Three small dots in the upper-left hint
      at the three pipeline phases (acquire / transform / export).
    * No gradients, no transparency, no external font references — every
      raster engine (sharp, Pillow, librsvg) can render this without
      needing installed fonts.

  If you change colors, update docs/commercial/brand/TOKENS.md in the same
  commit.  Keep this file < 60 lines so it survives code review.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     shape-rendering="geometricPrecision">
  <!-- background: brand-500 -->
  <rect width="1024" height="1024" fill="#1E88E5"/>

  <!-- subtle inner ring (slight tonal lift, still brand-500 family) -->
  <circle cx="512" cy="512" r="430" fill="#1976D2"/>

  <!-- white console disk -->
  <circle cx="512" cy="512" r="320" fill="#FFFFFF"/>

  <!-- three dots: acquire / transform / export -->
  <circle cx="380" cy="430" r="34" fill="#1E88E5"/>
  <circle cx="460" cy="430" r="34" fill="#1E88E5"/>
  <circle cx="540" cy="430" r="34" fill="#1E88E5"/>

  <!-- inset rounded square: the "node" -->
  <rect x="320" y="500" width="384" height="220" rx="36" ry="36"
        fill="#1E88E5"/>

  <!-- status pills inside the node -->
  <rect x="356" y="540" width="80"  height="36" rx="18" ry="18" fill="#FFFFFF"/>
  <rect x="356" y="588" width="160" height="20" rx="10" ry="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="356" y="616" width="120" height="20" rx="10" ry="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="356" y="644" width="200" height="20" rx="10" ry="10" fill="#FFFFFF" opacity="0.85"/>

  <!-- caret / forward arrow on the right side of the node -->
  <polygon points="660,560 660,640 720,600" fill="#FFFFFF"/>
</svg>